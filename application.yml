server:
  port: 2333
  address: 0.0.0.0

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - TVHTML5_SIMPLY
      - WEB_REMIX
      - MUSIC
      - WEB
      - ANDROID_VR
    oauth:
      enabled: true
      # After first boot, Railway logs will show a Google device auth URL and code.
      # Complete the flow, then paste the refresh token below and uncomment it:
      # refreshToken: "paste_your_refresh_token_here"

lavalink:
  server:
    password: "youshallnotpass"
    sources:
      youtube: false  # disabled — handled by youtube plugin above
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    youtubePlaylistLoadLimit: 50
    playerUpdateInterval: 5
    youtubeSearchEnabled: true

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
      snapshot: false

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  level:
    root: INFO
    lavalink: INFO